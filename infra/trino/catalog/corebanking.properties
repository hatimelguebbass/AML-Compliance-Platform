# The core banking database, read-only, for reconciling the lakehouse against its source (ADR 0010).
# The login role can select only the columns silver keeps; rules.json limits the catalog to dbt.
connector.name=postgresql
connection-url=jdbc:postgresql://source-db:5432/${ENV:SOURCE_DB_NAME}
connection-user=${ENV:RECONCILIATION_DB_USER}
connection-password=${ENV:RECONCILIATION_DB_PASSWORD}
