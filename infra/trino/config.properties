# Single node: the coordinator also runs the tasks.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
# Reporting tools log in over HTTPS with a password (ADR 0011). Services inside the compose
# network keep the HTTP listener, where the user is only declared: Trino accepts it unauthenticated.
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/security/keystore.p12
http-server.https.keystore.key=${ENV:TRINO_KEYSTORE_PASSWORD}
http-server.authentication.type=PASSWORD
http-server.authentication.allow-insecure-over-http=true
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}
# One user's workload on a 1.5 GB heap (jvm.config). The default 30% per query cannot
# rewrite a 5-million-row table; 700 MB plus the default 30% headroom stays under the heap.
# The image's 2 GB in-heap file cache is left out: it does not fit this heap.
query.max-memory-per-node=700MB
query.max-memory=700MB
