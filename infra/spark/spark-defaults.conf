spark.sql.extensions                              org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Two catalogs over the same Nessie repository: `lakehouse` reads published data
# on main, `lakehouse_etl` is where jobs write before the audit step merges.
spark.sql.catalog.lakehouse                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type                  rest
spark.sql.catalog.lakehouse.uri                   http://nessie:19120/iceberg/main
spark.sql.catalog.lakehouse.io-impl               org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint           http://seaweedfs:8333
spark.sql.catalog.lakehouse.s3.path-style-access  true

spark.sql.catalog.lakehouse_etl                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse_etl.type                  rest
spark.sql.catalog.lakehouse_etl.uri                   http://nessie:19120/iceberg/etl
spark.sql.catalog.lakehouse_etl.io-impl               org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse_etl.s3.endpoint           http://seaweedfs:8333
spark.sql.catalog.lakehouse_etl.s3.path-style-access  true

spark.sql.defaultCatalog                          lakehouse_etl
spark.sql.session.timeZone                        UTC
spark.driver.memory                               1g
spark.ui.showConsoleProgress                      false
# Jobs run on one node over daily files; the default of 200 shuffle partitions only adds task overhead.
spark.sql.shuffle.partitions                      16
# spark-sql starts an embedded Derby metastore and a warehouse dir in the working directory,
# which the host user the container runs as cannot write to. Neither is used: tables live in Nessie.
spark.driver.extraJavaOptions                     -Dderby.system.home=/tmp/derby
spark.sql.warehouse.dir                           /tmp/spark-warehouse
